<!doctype html>
<html lang="zh-CN">
  <head>

    <meta property="og:title" content="破晓前夜 Dawnfall" />

    <title>破晓前夜 Dawnfall｜现代联合作战推演</title>

  <body>
    <a class="skip-link" href="#hero-copy">跳到主要内容</a>
    <main class="landing">
      <div class="landing-grid" aria-hidden="true"></div>
      <header class="landing-nav">
        <a class="landing-brand" href="/" aria-label="破晓前夜首页">
          <img src="src/assets/dawnfall-mark.svg" alt="" />
          <span><b>破晓前夜</b><small>DAWNFALL</small></span>
        </a>
        <nav aria-label="主导航">
          <a href="/guide">玩法教程</a>
          <a href="https://github.com/Panther114/TomaHawk">项目仓库</a>
          <a class="nav-enter" href="/sandbox">进入推演</a>
        </nav>
      </header>

      <section class="hero-visual" aria-label="航母战斗群与舰载机">

        <img class="hero-carrier" src="src/assets/hero/carrier-group.webp" alt="航母战斗群侧向写实剪影" />
        <div class="hero-fallback" aria-hidden="true">
          <span class="fallback-jet"></span>
          <span class="fallback-carrier"></span>

        </div>
        <div class="bearing bearing-a">031° 14′ 22″ N</div>
        <div class="bearing bearing-b">127° 48′ 09″ E</div>

      <section id="hero-copy" class="hero-copy">
        <span class="eyebrow">现代联合作战推演</span>

        <p>在发现、共享与交战之间，决定战场走向。</p>
        <div class="hero-actions">
          <a class="primary-cta" href="/sandbox"><span>进入推演</span><i>→</i></a>
          <a class="text-cta" href="/guide">查看五分钟教程</a>
        </div>
      </section>

      <footer class="landing-foot">
        <span>v1.0 · DETERMINISTIC SIMULATION</span>
        <span>海上 · 水下 · 陆基 · 空中</span>
      </footer>

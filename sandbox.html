<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="战斧 Tomahawk——现代联合作战推演沙盘。" />
    <title>推演沙盘</title>
    <link rel="icon" href="src/assets/icon.png" />
    <link rel="preload" href="src/fonts/chi_font.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="src/fonts.css" />
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="stylesheet" href="src/tomahawk.css" />
  </head>
  <body class="sandbox-page">
    <a class="skip-link" href="#map">跳到战术地图</a>
    <main id="app">
      <canvas id="map" aria-label="战斧战术地图" tabindex="0"></canvas>

      <header id="brand-panel" class="hud-panel">
        <a class="brand-lockup" href="/" aria-label="返回战斧首页">
          <img src="src/assets/icon.png" alt="" />
          <span><b>战斧</b><small>TOMAHAWK · V1.0</small></span>
        </a>
        <div class="primary-actions" aria-label="主要工具">
          <button id="deploy-open" class="hud-button primary" type="button"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#deploy"></use></svg><span>部署兵力</span></button>
          <button id="map-tool-toggle" class="map-tool-toggle" type="button" data-tool-toggle="select" aria-pressed="false" aria-label="切换选择与测距">
            <span class="map-tool-option active"><b>选择</b><small>模式</small></span><span class="map-tool-option"><b>测距</b><small>模式</small></span><i class="map-tool-thumb" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <section id="battle-overview" class="hud-panel battle-overview" aria-label="双方战况">
        <button id="summary-collapse" class="icon-control summary-collapse" type="button" aria-expanded="true" aria-label="收起战况总览"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#chevron"></use></svg></button>
        <div id="status"></div>
      </section>
      <button id="top-reset" class="top-reset" data-reset type="button" aria-label="重置沙盘" title="重置沙盘"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#reset"></use></svg><span>重置沙盘</span></button>

      <div class="top-actions">
        <a class="icon-control" href="/guide" aria-label="打开操作手册" title="操作手册"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#help"></use></svg></a>
      </div>
      <aside id="tools-menu" class="hud-popover tools-menu is-open">
        <button id="save" type="button"><span><svg class="ui-icon"><use href="src/assets/ui-icons.svg#save"></use></svg>保存推演</span><kbd>Ctrl S</kbd></button>
        <button id="load" type="button"><span><svg class="ui-icon"><use href="src/assets/ui-icons.svg#load"></use></svg>载入推演</span></button>
        <button id="aar" type="button"><span><svg class="ui-icon"><use href="src/assets/ui-icons.svg#report"></use></svg>导出战报 AAR</span></button>
        <button id="mods-toggle" type="button"><span><svg class="ui-icon"><use href="src/assets/ui-icons.svg#workshop"></use></svg>单位工坊</span></button>
        <button id="tools-reset" class="danger" data-reset type="button"><span><svg class="ui-icon"><use href="src/assets/ui-icons.svg#reset"></use></svg>清空并重置</span></button>
        <a href="/"><span><svg class="ui-icon"><use href="src/assets/ui-icons.svg#home"></use></svg>返回首页</span></a>
      </aside>

      <aside id="right-panel" class="hud-panel context-panel retracted" aria-label="单位信息">
        <button class="context-handle rp-collapse" type="button" aria-label="展开单位信息" aria-expanded="false">
          <svg class="ui-icon context-expand-icon"><use href="src/assets/ui-icons.svg#chevron"></use></svg><span>兵力列表</span>
        </button>
        <div class="context-content">
          <div class="context-head">
            <strong>兵力列表</strong>
            <button id="context-close" class="icon-control" type="button" aria-label="收起"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#close"></use></svg></button>
          </div>
          <div id="unit-tab" class="context-view"></div>
        </div>
      </aside>

      <section id="map-hud" class="map-hud" aria-label="地图信息">
        <button id="layers-toggle" class="hud-button" type="button" aria-expanded="false" aria-controls="map-options"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#layers"></use></svg><span>图层</span></button>
        <section id="map-scale" aria-label="地图比例尺">
          <span id="scale-distance">50 km</span>
          <div class="scale-rule"><i id="scale-rule-fill"></i></div>
          <span id="scale-grid">网格 20 公里</span>
        </section>
        <span id="cursor">0.0, 0.0 km</span>
      </section>
      <section id="map-options" class="hud-popover layer-menu" hidden>
        <div class="popover-kicker">地图图层</div>
        <label><span><b>网格</b><small>距离与方位参照</small></span><input id="filter-grid" type="checkbox" checked /></label>
        <label><span><b>航迹</b><small>选中单位掌握的目标</small></span><input id="filter-tracks" type="checkbox" checked /></label>
        <label><span><b>雷达范围</b><small>传感器探测包线</small></span><input id="filter-radar" type="checkbox" /></label>
        <label><span><b>武器射程</b><small>当前可用武器包线</small></span><input id="filter-ranges" type="checkbox" checked /></label>
        <label><span><b>飞行武器</b><small>导弹与鱼雷轨迹</small></span><input id="filter-missiles" type="checkbox" checked /></label>
      </section>

      <section id="bottom-bar" class="hud-panel playback" aria-label="推演时间控制">
        <button id="play" class="play-button" type="button" aria-label="开始或暂停推演"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#play"></use></svg></button>
        <button id="reset" class="reset-button" data-reset type="button" aria-label="重置沙盘" title="重置沙盘"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#reset"></use></svg></button>
        <div class="time-readout"><small>推演时间</small><span id="clock">00:00</span></div>
        <label class="speed-control">
          <span>速度 <b id="speed-value">8×</b></span>
          <input id="speed" type="range" min="1" max="100" value="8" />
        </label>
      </section>

      <button id="placement-chip" class="placement-chip" type="button" hidden>
        <span class="side-dot"></span><b id="placement-name">蓝方 · 驱逐舰 DDG</b><small>单击连续部署 · Esc 结束</small>
      </button>
      <div id="placement-message" class="placement-message" role="status" aria-live="polite"></div>

      <select id="ship-class" hidden aria-hidden="true"></select>
      <input id="load-file" type="file" accept="application/json" hidden />
    </main>

    <div id="equipment-overlay" class="equipment-overlay" hidden>
      <div class="equipment-shell" role="dialog" aria-modal="true" aria-labelledby="equipment-title">
        <header class="equipment-head">
          <div>
            <h1 id="equipment-title">选择部署装备</h1>
          </div>
          <button id="equipment-close" class="equipment-close" type="button" aria-label="关闭装备库"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#close"></use></svg></button>
        </header>
        <div class="equipment-controls">
          <nav id="equipment-categories" aria-label="装备分类"></nav>
          <label class="equipment-search"><svg class="ui-icon"><use href="src/assets/ui-icons.svg#search"></use></svg><input id="equipment-search" type="search" placeholder="搜索型号、名称或任务类型" /></label>
        </div>
        <div id="equipment-grid" class="equipment-grid"></div>
        <footer class="equipment-footer"><span id="equipment-count">22 种装备</span><span>选择装备后返回地图部署</span></footer>
      </div>
    </div>

    <div id="mods-overlay" class="mods-overlay" hidden>
      <div class="mods-card">
        <div class="mods-head">
          <div class="mods-head-text">
            <span class="mods-title">单位工坊</span>
            <span class="mods-hint">编辑、复制或下载单位 · 也可将 JSON 拖入此窗口导入</span>
          </div>
          <button class="mods-close" id="mods-close" type="button">关闭</button>
        </div>
        <div class="mods-dropzone" aria-hidden="true">
          <strong>松开以导入 JSON</strong>
          <span>支持单位与弹药定义文件</span>
        </div>
        <div class="mods-body">
          <aside class="mods-list" id="mods-list"></aside>
          <section class="mods-detail" id="mods-detail"></section>
        </div>
      </div>
    </div>

    <div id="save-overlay" class="about-overlay" hidden>
      <div class="about-card save-card">
        <h1>保存推演</h1>
        <label class="save-field"><span>推演名称</span><input id="save-name" type="text" placeholder="未命名推演" /></label>
        <div class="save-location">
          <label><input type="radio" name="save-location" value="default" checked /> 保存到本地推演库</label>
          <label><input type="radio" name="save-location" value="custom" /> 下载到指定位置</label>
        </div>
        <div class="save-actions">
          <button class="about-close" id="save-cancel">取消</button>
          <button class="about-close primary" id="save-confirm">保存</button>
        </div>
      </div>
    </div>
    <div id="load-overlay" class="about-overlay" hidden>
      <div class="about-card save-card">
        <h1>载入推演</h1>
        <div id="load-list" class="load-list"></div>
        <div class="save-actions">
          <button class="about-close" id="load-import">从文件导入…</button>
          <button class="about-close" id="load-cancel">取消</button>
        </div>
      </div>
    </div>

    <div id="tour-overlay" class="tour-overlay" hidden>
      <div id="tour-spotlight" class="tour-spotlight"></div>
      <aside id="tour-card" class="tour-card">
        <small id="tour-progress">1 / 8</small>
        <h2 id="tour-title"></h2>
        <p id="tour-body"></p>
        <div><button id="tour-exit">退出</button><button id="tour-next">下一步</button></div>
      </aside>
    </div>

    <div class="mobile-gate">
      <img src="src/assets/icon.png" alt="" />
      <h1>沙盘需要更大的桌面视口</h1>
      <p>请使用至少 960×560 的桌面浏览器窗口。你仍可在当前设备阅读操作手册。</p>
      <a href="/guide">查看操作手册</a>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
